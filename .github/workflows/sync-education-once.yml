name: Sync education to generated CV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-education-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild pages
        run: python tools/build_site.py
      - name: Verify education and commit generated pages
        run: |
          grep -q 'Integrated M.S.–Ph.D. Program in Artificial Intelligence' cv.html
          grep -q '2021–2028 (Expected)' cv.html
          grep -q 'B.S. in Electronic Engineering' cv.html
          grep -q '2017–2021' cv.html
          ! grep -qi 'GPA' cv.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add education degrees and dates to CV [skip ci]'
            git push origin HEAD:main
          fi
