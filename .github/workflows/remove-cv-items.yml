name: Remove unwanted portfolio details
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-cv-items.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update source data and generated pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/profile.json')
          data = json.loads(path.read_text())
          for project in data['projects']:
              if project['id'] == 'balancing-robot':
                  project['technologies'] = project['technologies'].replace(' · TrueSTUDIO', '')
              if project['id'] == 'indoor-delivery':
                  project['description'] = 'Built an indoor delivery robot using Gmapping to create maps, AMCL for localization, and a DWA local planner for navigation.'
                  project['technologies'] = project['technologies'].replace(' · QR-code interaction', '')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          python tools/build_site.py
          rm .github/workflows/remove-cv-items.yml
      - name: Commit synchronized source and pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/profile.json index.html cv.html .github/workflows/remove-cv-items.yml
          git commit -m 'Remove TrueSTUDIO and QR-code interaction from portfolio'
          git push origin HEAD:main
