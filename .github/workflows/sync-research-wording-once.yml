name: Sync research wording to generated CV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-research-wording-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild generated pages
        run: python tools/build_site.py
      - name: Verify wording and commit generated pages
        run: |
          grep -q 'Researching shared spatial memory for multi-robot geometric foundation models' cv.html
          grep -q 'Researching real-time, multi-session scene change detection for lifelong 3D map management' cv.html
          grep -q 'Developing multi-robot SLAM, inter-robot coordination, and collaborative mapping' cv.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refine ongoing research wording in CV [skip ci]'
            git push origin HEAD:main
          fi
