name: Prepare academic profile media
on:
  push:
    branches: [feat/academic-cv-page]
    paths:
      - .github/workflows/prepare-profile-media.yml
      - tools/prepare_media.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow 'yt-dlp[default]'
      - name: Prepare media from original public sources
        run: python tools/prepare_media.py
      - name: Commit optimized media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images assets/media
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized profile media and source manifest [skip ci]'
            git pull --rebase origin '${{ github.ref_name }}'
            git push origin 'HEAD:${{ github.ref_name }}'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-media
          path: |
            assets/images
            assets/media
          retention-days: 7
