name: Sync AI Bots description to generated CV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-aibot-description-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild generated pages
        run: python tools/build_site.py
      - name: Verify and commit generated pages
        run: |
          grep -q 'Developing a robust decentralized multi-agent SLAM system designed to operate reliably under diverse real-world noise and uncertainties.' cv.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refine AI Bots description in CV [skip ci]'
            git push origin HEAD:main
          fi
