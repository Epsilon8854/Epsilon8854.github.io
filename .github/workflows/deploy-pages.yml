name: Deploy academic website to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/pages' --jq '{html_url,build_type,source,status}'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Cache original undergraduate project thumbnails
        run: python tools/fetch_project_media.py --strict
      - name: Build static profile and preserve existing project pages
        run: |
          python tools/build_site.py
          mkdir -p _site
          cp index.html cv.html robots.txt sitemap.xml .nojekyll _site/
          cp -RL assets _site/assets
          cp -RL AiSDF _site/AiSDF
          test -s _site/assets/media/obstacle-avoidance.gif
          test -s _site/assets/images/profile.jpg
          test -d _site/AiSDF
      - name: Upload complete static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed pages and all visible media
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          checks={};errors=[]
          profile=json.loads(Path('data/profile.json').read_text())
          def fetch(path):
              req=urllib.request.Request(base+path+'?deployment='+os.environ['GITHUB_SHA'],headers={'User-Agent':'GitHub-Pages-deployment-verification'})
              with urllib.request.urlopen(req,timeout=30) as response:return response.read()
          targets={'':None,'cv.html':None,'AiSDF/':'AiSDF'}
          for path,needle in targets.items():
              last=''
              for attempt in range(8):
                  try:
                      data=fetch(path)
                      if path in ['', 'cv.html']:
                          local=Path(path or 'index.html').read_bytes()
                          assert hashlib.sha256(data).digest()==hashlib.sha256(local).digest(),'Page differs from current build'
                      else: assert needle in data.decode('utf-8')
                      checks[path or '/']={'verified':True}
                      break
                  except Exception as exc:last=str(exc);time.sleep(5)
              else:errors.append({'path':path,'error':last})
          media={'assets/images/profile.jpg'}
          for item in profile['publications']+profile['projects']:
              media.add(item['image'])
              if item.get('animation'):media.add(item['animation'])
          for path in sorted(media):
              try:
                  data=fetch(path)
                  correct=hashlib.sha256(data).digest()==hashlib.sha256(Path(path).read_bytes()).digest()
                  checks[path]={'hash_match':correct}
                  if not correct:errors.append({'path':path,'error':'Media hash mismatch'})
              except Exception as exc:errors.append({'path':path,'error':str(exc)})
          report={'page_url':base,'commit':os.environ['GITHUB_SHA'],'checks':checks,'errors':errors}
          Path('deployment-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert not errors,'Public deployment verification failed'
          PY
      - name: Save deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-deployment-report
          path: deployment-report.json
          retention-days: 7
